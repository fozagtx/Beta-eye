<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>See Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>See Settings</h1>
      <p class="lede">Set global reading defaults. Simplification stays local to your browser.</p>

      <section aria-labelledby="displayTitle">
        <h2 id="displayTitle">Display</h2>
        <label><input id="openDyslexic" type="checkbox" /> Use OpenDyslexic</label>
        <label><input id="focusRuler" type="checkbox" /> Focus ruler on hover</label>
        <label>
          Theme
          <select id="theme">
            <option value="default">Default</option>
            <option value="soft">Soft contrast</option>
            <option value="highContrast">High contrast</option>
          </select>
        </label>
        <label>Line height <input id="lineHeight" type="range" min="1.2" max="2.4" step="0.1" /></label>
        <label>Letter spacing <input id="letterSpacing" type="range" min="0" max="3" step="0.1" /></label>
        <label>Word spacing <input id="wordSpacing" type="range" min="0" max="8" step="0.5" /></label>
        <label>Reading width <input id="maxWidth" type="range" min="45" max="95" step="1" /></label>
      </section>

      <section aria-labelledby="privacyTitle">
        <h2 id="privacyTitle">Privacy</h2>
        <label><input id="useAI" type="checkbox" /> Use Gemini Nano Prompt API when available</label>
        <p>Sensitive sites such as banking, health, email, docs editors, and code repos are skipped by default.</p>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="lib/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
