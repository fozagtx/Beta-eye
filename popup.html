<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>See</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" aria-labelledby="title">
      <header class="topbar">
        <img src="images/icon48.png" alt="" width="32" height="32" />
        <div>
          <h1 id="title">See</h1>
          <p id="status" role="status">Checking page...</p>
        </div>
        <button id="openOptions" class="icon-button" type="button" aria-label="Open settings">Settings</button>
      </header>

      <section aria-labelledby="profileTitle">
        <h2 id="profileTitle">Reading Profile</h2>
        <select id="profile" aria-label="Reading profile">
          <option value="cognitive">Cognitive load</option>
          <option value="dyslexia">Dyslexia</option>
          <option value="focus">ADHD / focus</option>
          <option value="lowVision">Low vision</option>
          <option value="esl">ESL</option>
          <option value="custom">Custom</option>
        </select>
      </section>

      <section aria-labelledby="levelTitle">
        <h2 id="levelTitle">Simplification</h2>
        <div class="segmented" role="radiogroup" aria-label="Simplification level">
          <button type="button" data-level="1" role="radio">Low</button>
          <button type="button" data-level="3" role="radio">Medium</button>
          <button type="button" data-level="5" role="radio">High</button>
        </div>
      </section>

      <label class="checkbox-row">
        <input id="showChanges" type="checkbox" />
        Show changed text with an outline
      </label>

      <div class="actions">
        <button id="simplify" type="button">Simplify page</button>
        <button id="restore" type="button" class="secondary">Restore original</button>
      </div>

      <button id="siteToggle" type="button" class="link-button">Disable this site</button>
      <p class="privacy">Local only. No telemetry. No external simplification calls.</p>
    </main>
    <script src="lib/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
